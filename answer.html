<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Answer Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f1f6ff; --border:#b9d0f5;
  --brown-deep:#000000; --brown-mid:#1565d8; --accent-warm:#1565d8;
  --success:#1a7f4b; --warning:#b45309; --danger:#b3261e;
  --text:#000000; --text-mid:#000000; --muted:#333333;
  --blue:#1565d8; --blue-dark:#0d47a1;
  --shadow:0 4px 32px rgba(13,71,161,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-user-select:none;user-select:none;}
input{-webkit-user-select:text;user-select:text;}
.hidden{display:none !important;}
.wrap{max-width:640px;margin:0 auto;padding:20px 14px 40px;}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:28px;}
h1,h2{font-family:'DM Sans',sans-serif;font-weight:800;color:#000;}
body::before{content:'';display:block;height:6px;background:linear-gradient(90deg,#1565d8,#4f8bff);}
.badge{display:inline-block;background:rgba(21,101,216,.18);border:1.5px solid rgba(21,101,216,.35);color:#0d47a1;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 16px;border-radius:30px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#000;margin-bottom:7px;}
input[type=text],input[type=number]{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:13px 14px;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--text);outline:none;}
input:focus{border-color:var(--brown-mid);box-shadow:0 0 0 3px rgba(21,101,216,.18);}
.btn{cursor:pointer;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;padding:14px 26px;}
.btn-primary{background:linear-gradient(135deg,#1976f2,#0d47a1);color:#fff;}
.btn-success{background:linear-gradient(135deg,#2f80ed,#1257c7);color:#fff;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.chip-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.chip-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chip{padding:12px 6px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;text-align:center;}
.chip.selected{border-color:var(--brown-mid);background:#e6efff;box-shadow:inset 0 0 0 1px var(--brown-mid);color:#000;font-weight:800;}
.info{background:rgba(21,101,216,.07);border:1.5px solid rgba(21,101,216,.3);border-radius:10px;padding:14px 16px;font-size:13px;color:#000;line-height:1.6;margin-bottom:20px;}
.err{background:rgba(155,48,48,.1);color:var(--danger);border:1px solid rgba(155,48,48,.3);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px;}
.footer{text-align:center;margin-top:24px;font-size:12px;color:var(--muted);letter-spacing:1px;}

.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:10;}
.student-name{font-family:'DM Sans',sans-serif;font-size:17px;font-weight:800;color:#000;}
.student-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.timer-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;}
#timer-display{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;color:#000;text-align:center;line-height:1;}
#timer-display.warning{color:var(--warning);}
#timer-display.danger{color:var(--danger);animation:pulse .6s infinite alternate;}
@keyframes pulse{from{opacity:1}to{opacity:.5}}
.tab-warning{font-size:11px;color:var(--danger);font-family:'JetBrains Mono',monospace;background:rgba(155,48,48,.1);border:1px solid rgba(155,48,48,.3);border-radius:8px;padding:4px 10px;display:none;margin-top:4px;}
.tab-warning.visible{display:block;}

.grid-container{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);}
.grid-title{padding:14px 20px;background:#e6efff;border-bottom:1.5px solid var(--border);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#000;display:flex;justify-content:space-between;}
.grid-title b{font-family:'JetBrains Mono',monospace;color:#000;font-weight:800;}
.q-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(185,208,245,.6);}
.q-row:last-child{border-bottom:none;}
.q-row.answered{background:rgba(21,101,216,.07);}
.q-num{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#000;width:40px;flex-shrink:0;}
.q-widget{flex:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.mcq-opts{display:flex;gap:8px;}
.mcq-opts input{display:none;}
.mcq-opts label{width:48px;height:48px;border-radius:10px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#000;cursor:pointer;}
.mcq-opts input:checked+label{border-color:var(--brown-mid);background:#e6efff;box-shadow:inset 0 0 0 2px var(--brown-mid);color:#000;}
.q-widget input[type=text],.q-widget input[type=number]{max-width:230px;}
.unit-tag{font-family:'JetBrains Mono',monospace;font-size:14px;color:#000;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;white-space:nowrap;}
.single-q{padding:34px 20px;text-align:center;}
.single-q .q-num{width:auto;font-size:22px;margin-bottom:20px;}
.single-q .q-widget{justify-content:center;}
.submit-area{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap;}
.submit-note{font-size:13px;color:var(--muted);flex:1;min-width:180px;}

.tbar{height:10px;background:#e6edf8;border-radius:99px;overflow:hidden;}
.tbar>i{display:block;height:100%;width:100%;background:#16a34a;border-radius:99px;transition:width .3s linear,background-color .3s;}
.tbar>i.yellow{background:#eab308;} .tbar>i.red{background:#dc2626;}
#timer-bar{width:100%;margin-top:6px;min-width:110px;}
#timer-display.danger{animation:none;}
</style>
</head>
<body>

<!-- LOADING / ERROR -->
<div id="view-loading" class="wrap"><div class="card" style="text-align:center;" id="loading-text">Loading answer sheet…</div></div>

<!-- REGISTRATION -->
<div id="view-reg" class="wrap hidden">
  <div class="card">
    <div style="text-align:center;margin-bottom:24px;">
      <span class="badge" id="reg-badge">Quiz</span>
      <h1 style="font-size:30px;margin-top:14px;">Answer Sheet</h1>
      <div style="color:var(--muted);font-size:14px;margin-top:4px;" id="reg-subtitle"></div>
    </div>
    <div class="info" id="reg-info"></div>
    <div id="reg-err" class="err hidden"></div>
    <div class="field"><label>Full Name</label><input type="text" id="reg-name" autocomplete="off"/></div>
    <div class="field"><label>Index Number</label><input type="text" id="reg-index" autocomplete="off"/></div>
    <div class="field"><label>Programme</label>
      <div class="chip-grid-2" id="prog-grid">
        <button type="button" class="chip" data-v="Materials Engineering">Materials Engineering</button>
        <button type="button" class="chip" data-v="Metallurgical Engineering">Metallurgical Engineering</button>
      </div></div>
    <div class="field"><label>Group Number</label><div class="chip-grid" id="group-grid"></div></div>
    <button class="btn btn-primary" style="width:100%;" id="btn-begin" onclick="beginQuiz()">Start →</button>
  </div>
  <div class="footer">©Team Benny</div>
</div>

<!-- ANSWER SHEET -->
<div id="view-quiz" class="wrap hidden">
  <div class="sheet-header">
    <div><div class="student-name" id="disp-name">—</div><div class="student-meta" id="disp-meta">—</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;">
      <div class="timer-label" id="timer-label">Time Remaining</div>
      <div id="timer-display">--:--</div>
      <div class="tbar" id="timer-bar"><i id="timer-bar-i"></i></div>
      <div class="tab-warning" id="tab-warn"></div>
    </div>
  </div>
  <div class="grid-container">
    <div class="grid-title"><span>Answer Sheet</span><span id="progress-text"><b>0</b> / 0</span></div>
    <div id="answer-grid"></div>
  </div>
  <div class="submit-area">
    <div class="submit-note" id="submit-note"></div>
    <button class="btn btn-success" id="btn-action" onclick="onAction()">Submit Answers</button>
  </div>
  <div class="footer">©Team Benny</div>
</div>

<!-- THANKS -->
<div id="view-thanks" class="wrap hidden" style="display:flex;align-items:center;justify-content:center;min-height:80vh;">
  <div style="text-align:center;"><div class="card">
    <span style="font-size:56px;" id="thanks-icon">✅</span>
    <h2 style="font-size:26px;margin:12px 0;" id="thanks-title">Submitted!</h2>
    <p style="color:var(--text-mid);" id="thanks-msg"></p>
  </div><div class="footer">©Team Benny</div></div>
</div>

<script>
/* ═════════ CONFIG ═════════ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkyX30HvqzdWFtds4JEkK_vNi0nMjpvyjqSPat9nZZEvez7cMfkPqNtlwU4K-IsYFs/exec";
const $ = id => document.getElementById(id);
const QUIZ_ID = new URLSearchParams(location.search).get('quiz');

function showView(n){ ['loading','reg','quiz','thanks'].forEach(v => $('view-'+v).classList.toggle('hidden', v!==n)); }
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

/* ═════════ LOAD QUIZ CONFIG ═════════ */
let cfg = null;
(async function load(){
  if(!QUIZ_ID){ $('loading-text').textContent = 'This link is missing a quiz code. Ask your instructor for the correct link.'; return; }
  try{
    const r = await (await fetch(`${SCRIPT_URL}?action=quiz&quiz=${encodeURIComponent(QUIZ_ID)}`)).json();
    if(!r.ok) throw new Error(r.error || 'Quiz not found');
    cfg = r.quiz;
    document.title = cfg.title;
    $('reg-badge').textContent = cfg.title;
    $('reg-subtitle').textContent = cfg.subtitle || '';
    const n = cfg.questions.length, pen = cfg.tabPenalty;
    const timing = cfg.timeMode==='per'
      ? `each question is timed and moves on automatically (${fmt(cfg.questions.reduce((a,q)=>a+(q.time||0),0))} total)`
      : `total time: ${cfg.generalMinutes} minute(s)`;
    $('reg-info').textContent = `${n} questions · shown on the projector, not here · ${timing} · the sheet opens when the instructor starts the quiz · tab switch = −${pen} pts`;
    showView('reg');
  }catch(e){ $('loading-text').textContent = 'Could not load this quiz: ' + e.message; }
})();

/* ═════════ REGISTRATION ═════════ */
let programme='', groupNumber='';
document.querySelectorAll('#prog-grid .chip').forEach(b => b.onclick = () => {
  document.querySelectorAll('#prog-grid .chip').forEach(x => x.classList.remove('selected'));
  b.classList.add('selected'); programme = b.dataset.v;
});
(function(){
  const g = $('group-grid');
  for(let i=1;i<=17;i++){
    const b = document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=i;
    b.onclick = () => { g.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); groupNumber='Group '+i; };
    g.appendChild(b);
  }
})();

/* ═════════ STATE ═════════ */
let studentName='', indexNumber='';
let answers = {}, tabSwitches = 0, submitted = false, running = false;
let startedAt = 0, curIdx = 0;

let _ac=null;
function unlockAudio(){ try{ _ac = _ac || new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume(); }catch(e){} }
function beep(){ try{ if(!_ac) return; const o=_ac.createOscillator(), g=_ac.createGain(); o.type='square'; o.frequency.value=980;
  g.gain.setValueAtTime(0.0001,_ac.currentTime); g.gain.exponentialRampToValueAtTime(0.25,_ac.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,_ac.currentTime+0.16);
  o.connect(g); g.connect(_ac.destination); o.start(); o.stop(_ac.currentTime+0.18); }catch(e){} }
let _lastBeep=-1;
function paintBar(barEl, rem, total){
  const f = total>0 ? Math.max(0,Math.min(1,rem/total)) : 0;
  barEl.style.width = (f*100)+'%';
  const red = rem>0 && f<=0.25, yellow = !red && f<=0.5;
  barEl.className = red ? 'red' : yellow ? 'yellow' : '';
  if(red && rem!==_lastBeep){ _lastBeep=rem; beep(); }
  if(!red) _lastBeep=-1;
}
let live = null, liveOffset = 0, shownIdx = -1, sheetBuilt = false, livePollTimer = null, liveDisplayTimer = null;
const isPer = () => cfg.timeMode === 'per';

function regError(msg){ const e=$('reg-err'); e.textContent=msg; e.classList.remove('hidden'); }

/* server clock: offset = serverTime - localTime, kept from the lowest-latency sample */
let bestRtt = Infinity;
async function fetchLive(){
  const t0 = Date.now();
  const r = await (await fetch(`${SCRIPT_URL}?action=live&quiz=${encodeURIComponent(QUIZ_ID)}&_=${t0}`, {cache:'no-store'})).json();
  const t1 = Date.now(), rtt = t1 - t0;
  if(r.ok && r.state){
    live = r.state;
    bestRtt *= 1.15;                                   // let old samples age out
    if(rtt <= bestRtt || bestRtt===Infinity){ bestRtt = rtt; liveOffset = (r.state.now || t1) - (t0 + t1)/2; }
  }
  return live;
}
const serverNow = () => Date.now() + liveOffset;

/* schedule → position. t = server-clock seconds since startAt; returns {idx, rem, total} or {done:true} */
function schedPos(st, serverNowMs){
  const t = (serverNowMs - st.startAt)/1000; let acc = 0;
  for(let i=0;i<st.durs.length;i++){
    const d = st.durs[i];
    if(t < acc + d) return { idx:i, rem: Math.max(0, Math.ceil(acc + d - t)), total:d };
    acc += d;
  }
  return { done:true };
}

function liveEnded(st){
  if(!st) return false;
  if(st.status==='finished') return true;
  return st.status==='running' && schedPos(st, serverNow()).done === true;
}

async function beginQuiz(){
  unlockAudio();
  $('reg-err').classList.add('hidden');
  const name = $('reg-name').value.trim(), idx = $('reg-index').value.trim();
  if(!name || !idx || !programme || !groupNumber){ regError('Please fill in all fields, select your programme, and select a group.'); return; }

  const btn = $('btn-begin'); btn.disabled = true; btn.textContent = 'Checking…';
  try{
    const r = await (await fetch(`${SCRIPT_URL}?action=check&quiz=${encodeURIComponent(QUIZ_ID)}&index=${encodeURIComponent(idx)}`)).json();
    if(r.ok && r.exists){
      regError('This index number has already submitted answers. You cannot submit again.');
      btn.disabled=false; btn.textContent='Start →'; return;
    }
  }catch(e){ console.warn('Duplicate check failed — the server will re-check on submit.', e); }
  try{
    const st = await fetchLive();
    if(liveEnded(st)){ regError('This quiz has already ended.'); btn.disabled=false; btn.textContent='Start →'; return; }
  }catch(e){}

  studentName = name; indexNumber = idx;
  answers = {}; tabSwitches = 0; submitted = false; curIdx = 0; running = false; shownIdx = -1; sheetBuilt = false;
  $('disp-name').textContent = studentName;
  $('disp-meta').textContent = `${indexNumber} · ${programme} · ${groupNumber}`;
  $('timer-label').textContent = isPer() ? 'This Question' : 'Time Remaining';
  $('timer-display').textContent = '--:--';
  $('btn-action').classList.add('hidden');
  showWaiting();
  showView('quiz');
  pollLive();
  liveDisplayTimer = setInterval(liveTick, 100);

  document.addEventListener('contextmenu', e=>e.preventDefault());
  document.addEventListener('copy', e=>e.preventDefault());
  document.addEventListener('cut', e=>e.preventDefault());
}

function showWaiting(){
  $('answer-grid').innerHTML = '<div class="single-q"><div style="font-size:42px;margin-bottom:10px;">⏳</div><div style="font-weight:700;">Waiting for the quiz to start…</div><div style="font-size:13px;color:var(--muted);margin-top:8px;">Keep this page open. The questions appear on the projector and your answer sheet opens automatically.</div></div>';
  $('submit-note').textContent = '';
  $('progress-text').innerHTML = 'Waiting…';
}

/* ═════════ FOLLOW THE PROJECTOR ═════════ */
async function pollLive(){
  if(submitted) return;
  try{ await fetchLive(); }catch(e){}
  // transitions are driven by the shared clock, not by polling; polling only catches Start / Skip / End quickly
  const delay = (live && live.status==='running') ? 3000 : 2000;
  livePollTimer = setTimeout(pollLive, delay);
}

function liveTick(){
  if(submitted || !live) return;
  const el = $('timer-display');
  if(live.status==='finished'){ stopLive(); submitQuiz(); return; }
  if(live.status!=='running'){ el.textContent = '--:--'; return; }

  const p = schedPos(live, serverNow());
  if(p.done){
    document.querySelectorAll('#answer-grid input').forEach(i => i.disabled = true);
    el.textContent = fmt(0); stopLive(); setTimeout(submitQuiz, 400); return;     // hard cut-off
  }
  if(!running){ running = true; startedAt = Date.now(); }
  if(isPer()){
    if(p.idx !== shownIdx){ shownIdx = p.idx; curIdx = Math.min(p.idx, cfg.questions.length-1); renderCurrent(); }
  } else if(!sheetBuilt){ sheetBuilt = true; renderFullSheet(); }
  const rem = p.rem, total = p.total;
  el.textContent = fmt(rem);
  const fr = rem/total;
  el.classList.remove('warning','danger');
  if(fr<=0.25) el.classList.add('danger'); else if(fr<=0.5) el.classList.add('warning');
  paintBar($('timer-bar-i'), rem, total);
}
function stopLive(){ clearInterval(liveDisplayTimer); clearTimeout(livePollTimer); }

document.addEventListener('visibilitychange', () => {
  if(document.hidden && running && !submitted){
    tabSwitches++;
    const w = $('tab-warn');
    w.textContent = `⚠ Tab switches: ${tabSwitches} (−${(tabSwitches*cfg.tabPenalty).toFixed(1)} pts)`;
    w.classList.add('visible'); setTimeout(()=>w.classList.remove('visible'), 3000);
  }
});

/* ═════════ SHEET RENDERING ═════════ */
function rowFor(q, i, single){
  const row = document.createElement('div');
  row.className = 'q-row' + (single ? ' single-q' : '');
  row.id = 'row-' + q.id;
  let w = '';
  if(q.type==='mcq'){
    w = '<div class="mcq-opts">' + ['A','B','C','D'].map(L =>
      `<input type="radio" name="${q.id}" id="${q.id}${L}" value="${L}"><label for="${q.id}${L}">${L}</label>`).join('') + '</div>';
  } else if(q.type==='text'){
    w = `<input type="text" id="in-${q.id}" placeholder="Type your answer" autocomplete="off" autocapitalize="none" autocorrect="off"/>`;
  } else {
    const tag = ((q.exponent ? `× 10^${q.exponent}` : '') + (q.unit ? ' ' + q.unit : '')).trim();
    w = `<input type="number" inputmode="decimal" step="any" id="in-${q.id}" placeholder="Number only"/>` + (tag ? `<span class="unit-tag"></span>` : '');
  }
  row.innerHTML = `<div class="q-num">Q${i+1}</div><div class="q-widget">${w}</div>`;
  const tagEl = row.querySelector('.unit-tag');
  if(tagEl) tagEl.textContent = ((q.exponent ? `× 10^${q.exponent}` : '') + (q.unit ? ' ' + q.unit : '')).trim();

  if(q.type==='mcq'){
    row.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', () => { answers[q.id]=r.value; mark(q.id); }));
    if(answers[q.id]){ const r = row.querySelector(`input[value="${answers[q.id]}"]`); if(r) r.checked = true; }
  } else {
    const inp = row.querySelector('#in-'+q.id);
    if(answers[q.id] !== undefined) inp.value = answers[q.id];
    inp.addEventListener('input', () => { if(inp.value.trim()==='') delete answers[q.id]; else answers[q.id]=inp.value; mark(q.id); });
  }
  if(answers[q.id] !== undefined) row.classList.add('answered');
  return row;
}

function renderFullSheet(){            // one general time: the whole sheet opens when the TA starts
  const grid = $('answer-grid'); grid.innerHTML = '';
  cfg.questions.forEach((q,i) => grid.appendChild(rowFor(q,i,false)));
  $('submit-note').textContent = 'Follow along with the questions on screen. The sheet closes automatically when the time ends.';
  $('btn-action').textContent = 'Submit Answers'; $('btn-action').classList.remove('hidden');
  updateProgress();
}
function renderCurrent(){              // per-question mode: only the question that is live on the projector
  const grid = $('answer-grid'); grid.innerHTML = '';
  grid.appendChild(rowFor(cfg.questions[curIdx], curIdx, true));
  $('submit-note').textContent = 'Each question has its own timer and moves on automatically. You can\'t go back.';
  $('btn-action').classList.add('hidden');
  updateProgress();
}
function onAction(){ submitQuiz(); }
function mark(qid){
  const row = $('row-'+qid); if(row) row.classList.toggle('answered', answers[qid] !== undefined);
  updateProgress();
}
function updateProgress(){
  const n = cfg.questions.length, done = Object.keys(answers).length;
  $('progress-text').innerHTML = isPer()
    ? `Question <b>${curIdx+1}</b> / ${n}` : `<b>${done}</b> / ${n} answered`;
}

/* ═════════ REVIEW COMMENT ═════════ */
function reviewFor(pct){
  const p = parseFloat(pct);
  if(isNaN(p)) return { emoji:'👏', text:'Well done for completing the quiz!' };
  if(p>=90) return { emoji:'🏆', text:'Outstanding! Excellent work!' };
  if(p>=75) return { emoji:'🌟', text:'Excellent, keep it up!' };
  if(p>=60) return { emoji:'👍', text:'Good job!' };
  if(p>=50) return { emoji:'🙂', text:'Fair effort, keep practising.' };
  if(p>=30) return { emoji:'📚', text:'Keep studying, you can do better.' };
  return { emoji:'💪', text:'Don\'t give up, review and try again.' };
}

/* ═════════ SUBMIT (scored on the server) ═════════ */
async function submitQuiz(){
  if(submitted) return;
  submitted = true; running = false;
  stopLive();
  const btn = $('btn-action'); btn.classList.remove('hidden'); btn.disabled = true; btn.textContent = 'Submitting…';

  const payload = {
    action:'submit', quizId: QUIZ_ID, studentName, indexNumber, programme, groupNumber,
    answers, tabSwitches, timeUsedSeconds: Math.round((Date.now()-startedAt)/1000)
  };
  try{
    const r = await (await fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)
    })).json();
    if(r.ok){
      const m = $('thanks-msg'); m.textContent = '';
      m.append('Your answers have been recorded, '); const b=document.createElement('strong'); b.textContent=studentName; m.append(b, '.');
      const rv = reviewFor(r.percentage);
      $('thanks-icon').textContent = rv.emoji; $('thanks-title').textContent = rv.text;
      showView('thanks');
    } else if(r.error==='duplicate'){
      $('thanks-icon').textContent='⚠️'; $('thanks-title').textContent='Already submitted';
      $('thanks-msg').textContent='This index number has already submitted answers, so this attempt was not recorded.';
      showView('thanks');
    } else throw new Error(r.error || 'Server error');
  }catch(e){
    // allow retry — answers are still in memory
    submitted = false;
    btn.disabled = false; btn.textContent = 'Retry Submit';
    btn.onclick = submitQuiz;
    alert('Could not submit (' + e.message + '). Check your connection and tap "Retry Submit".');
  }
}
</script>
